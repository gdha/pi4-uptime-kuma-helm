name: "🏗️ Container multi-Image Build"

on:
  pull_request:
    branches:
      - main
    paths:
      - container/**
  push:
    branches:
      - main
    paths:
      - container/**
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        default: false
        required: true
        description: "Push the image after the build?"

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install qemu dependency
        run: |-
          sudo apt-get update
          sudo apt-get install -y qemu-user-static
          sudo apt reinstall --yes libc-bin

      - name: Get Uptime-Kuma Version
        run: |-
          VERSION=`sed -nr "s;.*docker.io/louislam/uptime-kuma:(.*)-debian.*;\1;p" container/Containerfile`
          echo "APP_VERSION=${VERSION}"
          echo "APP_VERSION=${VERSION}" >> $GITHUB_ENV

      - id: container
        name: Build Container Image
        uses: redhat-actions/buildah-build@3a51aade9afa17e5c78256bcbe2e1ee08c7b995b # v3.0.2
        with:
          image: uptime-kuma
          tags: >-
            ${{ env.APP_VERSION }}
          oci: true
          platforms: linux/amd64, linux/arm64
          containerfiles: |-
            container/Containerfile

      - name: Push container image to ghcr.io
        if: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)) && github.ref == 'refs/heads/main' }}
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3.0.0
        with:
          platforms: linux/amd64, linux/arm64
          image: ${{ steps.container.outputs.image }}
          tags: ${{ steps.container.outputs.tags }}
          labels: ${{ steps.container.outputs.labels }}
          registry: ghcr.io/${{ github.repository_owner }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

